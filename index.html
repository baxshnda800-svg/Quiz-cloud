<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کورد ئیمەیج کویز</title>
<meta name="description" content="Create a custom quiz from any image using AI">
<meta name="theme-color" content="#0a0a14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0a0a14; --surface:#12121f; --surface-2:#181828; --border:#26263c;
  --text:#f2f2fa; --muted:#9797b3; --accent1:#5b6cff; --accent2:#9b5bff; --accent3:#ff5ba8;
  --success:#22c55e; --success-bg:#122a1c; --danger:#ef4444; --danger-bg:#2a1216;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f3f3fa; --surface:#ffffff; --surface-2:#f6f6fd; --border:#e4e4f0;
  --text:#15151f; --muted:#68687f; --success:#16a34a; --success-bg:#e8f9ee;
  --danger:#dc2626; --danger-bg:#fdecec; --shadow:0 10px 30px rgba(30,30,60,.08);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:'Segoe UI', Tahoma, 'Noto Sans Arabic', system-ui, sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .25s ease, color .25s ease;
}
[dir="rtl"] body{font-family:'Segoe UI','Noto Sans Arabic','Rabar 021','Vazirmatn',Tahoma,sans-serif;}
img{max-width:100%;}
button{font-family:inherit;}
.wrap{max-width:760px; margin:0 auto; padding:0 18px 60px;}

/* Header */
header{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 18px; border-bottom:1px solid var(--border); position:sticky; top:0;
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); z-index:40;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
.header-left{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
}
.lang-pills{display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px;}
.lang-pill{
  border:none; background:transparent; color:var(--muted); padding:6px 12px; border-radius:999px;
  font-size:13px; cursor:pointer; white-space:nowrap;
}
.lang-pill.active{background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff;}
.version-badge{font-size:11px; color:var(--accent2); border:1px solid var(--border); background:var(--surface); padding:5px 10px; border-radius:999px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-name{font-weight:700; font-size:13px; line-height:1.35; text-align:end;}
.logo-ring{
  width:46px; height:46px; border-radius:50%; padding:2px; flex:none;
  background:conic-gradient(from 180deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
}
.logo-ring img{width:100%; height:100%; border-radius:50%; display:block; background:#000;}

/* Hero */
.hero{padding:34px 0 22px; text-align:center;}
.hero h1{
  font-size:26px; margin:0 0 10px; font-weight:800;
  background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{color:var(--muted); margin:0; font-size:14.5px; line-height:1.6;}

/* Cards */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; margin-bottom:18px; box-shadow:var(--shadow);
}
.dropzone{
  border:2px dashed var(--border); border-radius:var(--radius); padding:36px 16px; text-align:center; cursor:pointer;
  transition:border-color .2s, background .2s;
}
.dropzone.dragover{border-color:var(--accent2); background:var(--surface-2);}
.dz-icon{
  width:64px; height:64px; margin:0 auto 16px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent1) 30%, transparent), color-mix(in srgb, var(--accent2) 30%, transparent));
  color:var(--accent2);
}
.dz-title{font-weight:700; font-size:16px; margin-bottom:6px;}
.dz-sub{color:var(--muted); font-size:13px; margin-bottom:14px;}
.dz-btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); padding:9px 16px;
  border-radius:999px; font-size:13px; cursor:pointer;
}
.thumbs{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
.thumb{position:relative; width:76px; height:76px; border-radius:12px; overflow:hidden; border:1px solid var(--border);}
.thumb img{width:100%; height:100%; object-fit:cover;}
.thumb button{
  position:absolute; top:3px; inset-inline-end:3px; width:20px; height:20px; border-radius:50%; border:none;
  background:rgba(0,0,0,.6); color:#fff; font-size:12px; cursor:pointer; line-height:1;
}

hr.sep{border:none; border-top:1px solid var(--border); margin:20px 0;}

.field-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
.field-label{font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:6px;}
.field-hint{color:var(--muted); font-size:12.5px;}

.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
.opt-btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:var(--radius-sm);
  padding:16px 10px; text-align:center; cursor:pointer; font-size:13.5px; font-weight:600;
}
.opt-btn .oi{display:block; margin:0 auto 8px; opacity:.85;}
.opt-btn.active{border-color:var(--accent2); background:color-mix(in srgb, var(--accent2) 16%, var(--surface-2)); color:var(--text); box-shadow:0 0 0 1px var(--accent2) inset;}

.stepper{display:flex; align-items:center; gap:10px;}
.step-btn{
  width:42px; height:42px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-size:20px; cursor:pointer; flex:none;
}
.step-val{flex:1; text-align:center; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px; font-weight:700; font-size:16px;}

.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:999px;
  padding:8px 16px; font-size:13.5px; cursor:pointer;
}
.chip.active{background:linear-gradient(135deg,var(--accent1),var(--accent2)); border-color:transparent; color:#fff; font-weight:700;}

.generate-btn{
  width:100%; padding:15px; border:none; border-radius:14px; font-size:15.5px; font-weight:800; cursor:pointer;
  background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3)); color:#fff; margin-top:6px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.generate-btn:disabled{opacity:.55; cursor:not-allowed;}

.apikey-note{font-size:12.5px; color:var(--muted); text-align:center; margin-top:10px; cursor:pointer; text-decoration:underline;}

/* Loading */
.loading-wrap{text-align:center; padding:40px 0;}
.loading-icon{
  width:150px; height:150px; margin:0 auto 24px; border-radius:24px; overflow:hidden; position:relative;
  background:linear-gradient(135deg,#2b2bdc,#7a2bd6); display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow);
}
.loading-icon svg{width:80px; height:80px; color:#fff; opacity:.92;}
.sparkle{
  width:60px; height:60px; border-radius:50%; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--accent2),var(--accent3)); animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.loading-title{font-weight:800; font-size:19px; color:var(--accent2); margin-bottom:8px;}
.loading-sub{color:var(--muted); font-size:13.5px; max-width:340px; margin:0 auto;}
.dots{display:flex; justify-content:center; gap:8px; margin-top:20px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
.dot.active{background:var(--accent2);}

/* Quiz */
.quiz-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
.progress-bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-bottom:16px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3)); transition:width .3s;}
.q-pills{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px;}
.q-pill{
  flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-weight:700; cursor:pointer; font-size:13px;
}
.q-pill.current{background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff; border-color:transparent;}
.q-pill.answered{border-color:var(--accent2); color:var(--accent2);}
.badge{font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--muted);}
.q-label{font-size:13px; color:var(--accent2); font-weight:700; margin-bottom:10px;}
.q-text{font-size:18px; font-weight:700; line-height:1.6; margin-bottom:20px;}
.q-options{display:flex; flex-direction:column; gap:10px;}
.q-opt{
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px 16px;
  border:1px solid var(--border); border-radius:12px; background:var(--surface-2); cursor:pointer; font-size:14.5px; text-align:start;
}
.q-opt .letter{
  width:28px; height:28px; border-radius:50%; background:var(--bg); border:1px solid var(--border); display:flex;
  align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex:none;
}
.q-opt.selected{border-color:var(--accent2); background:color-mix(in srgb, var(--accent2) 14%, var(--surface-2));}
.q-opt.selected .letter{background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff; border-color:transparent;}
.q-opt.correct{border-color:var(--success); background:var(--success-bg);}
.q-opt.correct .letter{background:var(--success); color:#fff; border-color:transparent;}
.q-opt.wrong{border-color:var(--danger); background:var(--danger-bg);}
.q-opt.wrong .letter{background:var(--danger); color:#fff; border-color:transparent;}
.q-short{display:flex; gap:10px; margin-top:6px;}
.q-short input{
  flex:1; padding:14px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-size:14.5px;
}
.q-short button{
  border:none; border-radius:12px; padding:0 20px; background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:#fff; font-weight:700; cursor:pointer; font-size:14px;
}
.short-result{margin-top:12px; font-size:13.5px; padding:10px 14px; border-radius:10px;}
.short-result.correct{background:var(--success-bg); color:var(--success);}
.short-result.wrong{background:var(--danger-bg); color:var(--danger);}
.nav-row{display:flex; gap:12px; margin-top:16px;}
.nav-btn{
  flex:1; padding:14px; border-radius:14px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-weight:700; cursor:pointer; font-size:14.5px;
}
.nav-btn.primary{background:linear-gradient(90deg,var(--accent1),var(--accent2)); color:#fff; border:none;}
.nav-btn:disabled{opacity:.4; cursor:not-allowed;}
.finish-btn{
  width:100%; margin-top:14px; padding:15px; border:none; border-radius:14px; font-weight:800; cursor:pointer;
  background:linear-gradient(90deg,var(--accent3),var(--accent2)); color:#fff; font-size:15px;
}

/* Results */
.result-icon{width:72px; height:72px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;}
.result-title{text-align:center; font-size:22px; font-weight:800; margin-bottom:8px;}
.result-sub{text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:22px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
.stat-box{border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center; background:var(--surface-2);}
.stat-box .num{font-size:26px; font-weight:800; margin-top:4px;}
.stat-box.ok{background:var(--success-bg);} .stat-box.ok .num{color:var(--success);}
.stat-box.bad{background:var(--danger-bg);} .stat-box.bad .num{color:var(--danger);}
.stat-box .lbl{font-size:12.5px; color:var(--muted);}
.review-item{border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px;}
.review-tag{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:5px 12px; border-radius:999px; margin-bottom:10px;}
.review-tag.correct{background:var(--success-bg); color:var(--success);}
.review-tag.wrong{background:var(--danger-bg); color:var(--danger);}
.section-title{font-weight:800; font-size:17px; margin:26px 0 14px;}

/* Settings modal */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:22px; max-width:420px; width:100%;}
.modal h3{margin:0 0 10px;}
.modal p{color:var(--muted); font-size:13px; line-height:1.6;}
.modal input{
  width:100%; padding:13px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-size:14px; margin:10px 0;
}
.modal a{color:var(--accent2);}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.modal-actions button{flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); cursor:pointer; font-weight:700;}
.modal-actions .save{background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff; border:none;}
.modal-actions .cancel{background:var(--surface-2); color:var(--text);}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border);
  padding:12px 20px; border-radius:12px; box-shadow:var(--shadow); font-size:13.5px; z-index:200; display:none;
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
}
.hidden{display:none !important;}
@media (prefers-reduced-motion:reduce){.sparkle{animation:none;}}
</style>
</head>
<body data-theme="dark">

<header>
  <div class="header-left">
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"></button>
    <div class="lang-pills" id="langPills">
      <button class="lang-pill" data-lang="en">EN</button>
      <button class="lang-pill" data-lang="ar">عربي</button>
      <button class="lang-pill" data-lang="tr">Türkçe</button>
      <button class="lang-pill active" data-lang="ku">کوردی</button>
    </div>
    <button class="icon-btn" id="settingsBtn" title="API key" aria-label="Settings">⚙️</button>
    <span class="version-badge">v1.0</span>
  </div>
  <div class="brand">
    <div class="brand-name" id="brandName">کورد<br>ئیمەیج<br>کویز</div>
    <div class="logo-ring"><img src="icons/icon-192.png" alt="logo"></div>
  </div>
</header>

<div class="wrap">

  <!-- SETUP SCREEN -->
  <section id="setupScreen">
    <div class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroSub"></p>
    </div>

    <div class="card">
      <div class="dropzone" id="dropzone">
        <div class="dz-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        </div>
        <div class="dz-title" data-i18n="dzTitle"></div>
        <div class="dz-sub" data-i18n="dzSub"></div>
        <button type="button" class="dz-btn" data-i18n="dzBtn"></button>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" multiple style="display:none">
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="card">
      <div class="field-row">
        <div class="field-label" data-i18n="styleLabel"></div>
      </div>
      <div class="opt-grid" id="styleGrid">
        <button class="opt-btn" data-style="mixed">
          <svg class="oi" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
          <span data-i18n="styleMixed"></span>
        </button>
        <button class="opt-btn" data-style="mcq">
          <svg class="oi" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
          <span data-i18n="styleMCQ"></span>
        </button>
        <button class="opt-btn" data-style="short">
          <svg class="oi" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          <span data-i18n="styleShort"></span>
        </button>
        <button class="opt-btn" data-style="tf">
          <svg class="oi" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          <span data-i18n="styleTF"></span>
        </button>
      </div>

      <div class="field-row">
        <div class="field-label" data-i18n="countLabel"></div>
        <div class="field-hint" data-i18n="countHint"></div>
      </div>
      <div class="stepper">
        <button class="step-btn" id="countMinus">−</button>
        <div class="step-val" id="countVal">8</div>
        <button class="step-btn" id="countPlus">+</button>
      </div>

      <hr class="sep">

      <div class="field-row">
        <div class="field-label">🌐 <span data-i18n="quizLangLabel"></span></div>
      </div>
      <div class="chip-row" id="quizLangChips">
        <button class="chip" data-qlang="en">English</button>
        <button class="chip" data-qlang="ar">عربي</button>
        <button class="chip" data-qlang="tr">Türkçe</button>
        <button class="chip active" data-qlang="ku">کوردی</button>
      </div>

      <div class="field-row" style="margin-top:16px;">
        <div class="field-label" data-i18n="difficultyLabel"></div>
      </div>
      <div class="chip-row" id="difficultyChips">
        <button class="chip" data-diff="easy" data-i18n="diffEasy"></button>
        <button class="chip active" data-diff="medium" data-i18n="diffMedium"></button>
        <button class="chip" data-diff="hard" data-i18n="diffHard"></button>
      </div>
    </div>

    <button class="generate-btn" id="generateBtn">
      <span>✨</span><span data-i18n="generateBtn"></span>
    </button>
    <div class="apikey-note" id="apiKeyNote" data-i18n="apiKeyNote"></div>
  </section>

  <!-- LOADING SCREEN -->
  <section id="loadingScreen" class="hidden">
    <div class="card loading-wrap">
      <div class="loading-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3a4 4 0 00-4 4v1a3 3 0 00-2 5.5V16a3 3 0 003 3h1"/><path d="M12 3a4 4 0 014 4v1a3 3 0 012 5.5V16a3 3 0 01-3 3h-1"/><path d="M12 3v16"/></svg>
      </div>
      <div class="sparkle">✨</div>
      <div class="loading-title" id="loadingTitle" data-i18n="loadingTitle"></div>
      <div class="loading-sub" id="loadingSub" data-i18n="loadingSub1"></div>
      <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="quizScreen" class="hidden">
    <div class="card">
      <div class="quiz-top">
        <span class="badge" id="qCounter"></span>
        <span class="badge" id="qTypeBadge"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="q-pills" id="qPills"></div>
    </div>
    <div class="card">
      <div class="q-label" data-i18n="questionLabel"></div>
      <div class="q-text" id="qText"></div>
      <div class="q-options" id="qOptions"></div>
      <div id="qShortWrap" class="hidden">
        <div class="q-short">
          <input type="text" id="qShortInput" data-i18n-ph="shortPlaceholder">
          <button id="qShortSubmit" data-i18n="submitAnswer"></button>
        </div>
        <div id="shortResult"></div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" data-i18n="prevQuestion"></button>
      <button class="nav-btn primary" id="nextBtn" data-i18n="nextQuestion"></button>
    </div>
    <button class="finish-btn hidden" id="finishBtn" data-i18n="finishQuiz"></button>
  </section>

  <!-- RESULTS SCREEN -->
  <section id="resultsScreen" class="hidden">
    <div class="card" style="text-align:center;">

/* ===================== State ===================== */
let state = {
  uiLang: localStorage.getItem('kiq_ui_lang') || 'ku',

const $ = sel => document.querySelector(sel);
const $all = sel => Array.from(document.querySelectorAll(sel));

/* ===================== i18n rendering (UI ONLY — never touches quiz content) ===================== */
function applyUILanguage(){
  const t = I18N[state.uiLang];
  document.documentElement.lang = state.uiLang;
  document.documentElement.dir = t.dir;
  $('#brandName').innerHTML = t.brand;
  $all('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[key]!==undefined) el.innerHTML = t[key];
  });
  $all('[data-i18n-ph]').forEach(el=>{
    const key = el.getAttribute('data-i18n-ph');
    if(t[key]!==undefined) el.setAttribute('placeholder', t[key]);
  });
  $all('.lang-pill').forEach(b=>b.classList.toggle('active', b.dataset.lang===state.uiLang));
  renderQuizNavIfActive();
}

function t(key){ return I18N[state.uiLang][key] || key; }

/* ===================== Theme ===================== */
function applyTheme(){
  document.body.setAttribute('data-theme', state.theme);
  $('#themeToggle').textContent = state.theme==='dark' ? '☀️' : '🌙';
}
$('#themeToggle').addEventListener('click', ()=>{
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  localStorage.setItem('kiq_theme', state.theme);
  applyTheme();
});

/* ===================== UI language switcher (independent from quiz language) ===================== */
$('#langPills').addEventListener('click', e=>{
  const btn = e.target.closest('.lang-pill');
  if(!btn) return;
  state.uiLang = btn.dataset.lang;
  localStorage.setItem('kiq_ui_lang', state.uiLang);
  applyUILanguage();

/* ===================== Stepper ===================== */
function renderCount(){ $('#countVal').textContent = state.count; }
$('#countMinus').addEventListener('click', ()=>{ state.count=Math.max(1,state.count-1); renderCount(); });
$('#countPlus').addEventListener('click', ()=>{ state.count=Math.min(50,state.count+1); renderCount(); });

/* ===================== Image upload ===================== */
const dropzone = $('#dropzone'), fileInput = $('#fileInput');
dropzone.addEventListener('click', ()=>fileInput.click());
dropzone.addEventListener('dragover', e=>{ e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()=>dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e=>{
  e.preventDefault(); dropzone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', ()=>handleFiles(fileInput.files));

function handleFiles(fileList){
  Array.from(fileList).forEach(file=>{
    if(!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = reader.result;
      const base64 = dataUrl.split(',')[1];
      state.images.push({dataUrl, mimeType:file.type, base64});
      renderThumbs();
    };
    reader.readAsDataURL(file);
  });
  fileInput.value = '';
}
function renderThumbs(){
  const wrap = $('#thumbs');
  wrap.innerHTML = '';
  state.images.forEach((img,i)=>{
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = `<img src="${img.dataUrl}"><button data-i="${i}">✕</button>`;
    wrap.appendChild(d);
  });
}
$('#thumbs').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  state.images.splice(Number(btn.dataset.i),1);
  renderThumbs();
});

  return !!BUILT_IN_API_KEY && BUILT_IN_API_KEY !== 'PASTE_YOUR_GEMINI_API_KEY_HERE';

function getApiKey(){
  return localStorage.getItem('kiq_gemini_key') || (hasBuiltInKey() ? BUILT_IN_API_KEY : '');

function showToast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ el.style.display='none'; }, 3200);
}

/* ===================== Gemini generation ===================== */
const LANG_NAMES = { en:'English', ar:'Arabic (Modern Standard Arabic)', tr:'Turkish', ku:'Central Kurdish (Sorani, using Kurdish-Arabic script)' };
const STYLE_NAMES = { mixed:'a varied mix of multiple-choice, true/false and short-answer', mcq:'only multiple-choice (4 options each)', short:'only short-answer (free text)', tf:'only true/false' };

async function generateQuiz(){
  if(state.images.length===0){ showToast(t('uploadFirst')); return; }
  const apiKey = getApiKey();
  if(!apiKey){ showToast(t('noApiKey')); openModal(); return; }

  showScreen('loadingScreen');
  cycleLoadingTips();

  const quizLangName = LANG_NAMES[state.quizLang];
  const prompt = `You are a quiz generator. Look carefully at the attached image(s) and create an educational quiz based on what is visibly shown in them (objects, text, scene, context, details).

Write the ENTIRE quiz (questions, all answer options, and correct answers) strictly in ${quizLangName}. Do not use any other language anywhere in the output, regardless of any other instruction.

Requirements:
- Create exactly ${state.count} questions.
- Question style: ${STYLE_NAMES[state.style]}.
- Difficulty: ${state.difficulty}.
- For "mcq" type questions include exactly 4 options and a zero-based "correctIndex".
- For "truefalse" type questions, "options" must be a 2-item array meaning [True-label, False-label] written in ${quizLangName}, with "correctIndex" 0 or 1.
- For "short" type questions, omit "options"/"correctIndex" and instead provide "correctAnswer" as a short expected answer string.

Return ONLY valid JSON (no markdown fences, no commentary) matching exactly this shape:
{"questions":[{"type":"mcq|truefalse|short","question":"...","options":["..."],"correctIndex":0,"correctAnswer":"..."}]}`;

  const parts = [{text: prompt}];
  state.images.forEach(img=> parts.push({inlineData:{mimeType:img.mimeType, data:img.base64}}));

  try{
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{ role:'user', parts }], generationConfig:{ responseMimeType:'application/json' } })
    });
    if(!resp.ok){ throw new Error('HTTP '+resp.status); }
    const data = await resp.json();
    let raw = data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
    raw = raw.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(raw);
    const qs = parsed.questions || [];
    if(!qs.length) throw new Error('empty');
    state.questions = qs;
    state.answers = qs.map(()=>({selected:null, submitted:false, correct:null, text:''}));
    state.current = 0;
    startQuiz();
  }catch(err){
    console.error(err);
    showToast(t('genError'));
    showScreen('setupScreen');
  }
}
$('#generateBtn').addEventListener('click', generateQuiz);

let loadingTimer = null;
function cycleLoadingTips(){
  const tips = ['loadingSub1'];
  let i=0;
  clearInterval(loadingTimer);
  $('#loadingSub').innerHTML = t(tips[0]);
  loadingTimer = setInterval(()=>{
    $all('.dots .dot').forEach((d,idx)=>d.classList.toggle('active', idx===(i%3)));
    i++;
  }, 500);
}

/* ===================== Screen switching ===================== */
function showScreen(id){
  ['setupScreen','loadingScreen','quizScreen','resultsScreen'].forEach(s=>{
    $('#'+s).classList.toggle('hidden', s!==id);
  });
  if(id!=='loadingScreen') clearInterval(loadingTimer);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ===================== Quiz taking ===================== */
function startQuiz(){
  showScreen('quizScreen');
  renderQuestion();
}
function renderQuizNavIfActive(){
  if(!$('#quizScreen').classList.contains('hidden') && state.questions.length) renderQuestion();
}

function renderQuestion(){
  const idx = state.current;
  const q = state.questions[idx];
  const ans = state.answers[idx];
  const total = state.questions.length;

  $('#qCounter').textContent = `${t('questionLabel').replace(':','')} ${idx+1} ${t('of')} ${total}`;
  const typeLabelMap = {mcq:t('styleMCQ'), truefalse:t('styleTF'), short:t('styleShort')};
  $('#qTypeBadge').textContent = typeLabelMap[q.type] || '';
  $('#progressFill').style.width = `${((idx+1)/total)*100}%`;

  const pillsWrap = $('#qPills');
  pillsWrap.innerHTML = '';
  state.questions.forEach((_,i)=>{
    const b = document.createElement('button');
    b.className = 'q-pill' + (i===idx?' current':'') + (state.answers[i].submitted?' answered':'');
    b.textContent = i+1;
    b.addEventListener('click', ()=>{ state.current=i; renderQuestion(); });
    pillsWrap.appendChild(b);
  });

  $('#qText').textContent = q.question;

  const optsWrap = $('#qOptions');
  const shortWrap = $('#qShortWrap');
  optsWrap.innerHTML = '';

  if(q.type==='short'){
    optsWrap.classList.add('hidden');
    shortWrap.classList.remove('hidden');
    $('#qShortInput').value = ans.text || '';
    $('#qShortInput').disabled = ans.submitted;
    renderShortResult();
  } else {
    shortWrap.classList.add('hidden');
    optsWrap.classList.remove('hidden');
    const letters = ['A','B','C','D'];
    (q.options||[]).forEach((opt,i)=>{
      const el = document.createElement('button');
      el.className = 'q-opt';
      if(ans.submitted){
        if(i===q.correctIndex) el.classList.add('correct');
        else if(i===ans.selected) el.classList.add('wrong');
      } else if(i===ans.selected){
        el.classList.add('selected');
      }
      el.innerHTML = `<span>${opt}</span><span class="letter">${letters[i]||i+1}</span>`;
      el.addEventListener('click', ()=>{
        if(ans.submitted) return;
        ans.selected = i;
        ans.submitted = true;
        ans.correct = (i===q.correctIndex);
        renderQuestion();
      });
      optsWrap.appendChild(el);
    });
  }

  $('#prevBtn').disabled = idx===0;
  const isLast = idx===total-1;
  $('#nextBtn').classList.toggle('hidden', isLast);
  $('#finishBtn').classList.toggle('hidden', !isLast);
}

function renderShortResult(){
  const idx = state.current;
  const ans = state.answers[idx];
  const box = $('#shortResult');
  box.innerHTML = '';
  if(ans.submitted){
    const q = state.questions[idx];
    const isCorrect = ans.correct;
    box.innerHTML = `<div class="short-result ${isCorrect?'correct':'wrong'}">${isCorrect? t('answerCorrect') : (t('answerWrong')+' — '+t('correctAnswer')+': '+q.correctAnswer)}</div>`;
  }
}
$('#qShortSubmit').addEventListener('click', ()=>{
  const idx = state.current;
  const q = state.questions[idx];
  const ans = state.answers[idx];
  if(ans.submitted) return;
  const val = $('#qShortInput').value.trim();
  ans.text = val;
  ans.submitted = true;
  ans.correct = val.length>0 && q.correctAnswer && val.toLowerCase().includes(String(q.correctAnswer).toLowerCase().slice(0, Math.max(3,String(q.correctAnswer).length)).toLowerCase()) || val.toLowerCase()===String(q.correctAnswer||'').toLowerCase();
  renderQuestion();
});

$('#prevBtn').addEventListener('click', ()=>{ if(state.current>0){ state.current--; renderQuestion(); } });
$('#nextBtn').addEventListener('click', ()=>{ if(state.current<state.questions.length-1){ state.current++; renderQuestion(); } });
$('#finishBtn').addEventListener('click', showResults);

/* ===================== Results ===================== */
function showResults(){
  const total = state.questions.length;
  const correct = state.answers.filter(a=>a.correct).length;
  const wrong = total - correct;
  const rate = total? Math.round((correct/total)*100) : 0;

  $('#successRateVal').textContent = rate+'%';
  $('#scoreVal').textContent = `${correct}/${total}`;
  $('#wrongVal').textContent = wrong;
  $('#correctVal').textContent = correct;

  const list = $('#reviewList');
  list.innerHTML = '';
  state.questions.forEach((q,i)=>{
    const ans = state.answers[i];
    const div = document.createElement('div');
    div.className = 'review-item';
    let body = `<div class="review-tag ${ans.correct?'correct':'wrong'}">${ans.correct?'✅':'❌'} ${t('questionLabel').replace(':','')} ${i+1} ${t('of')} ${state.questions.length}</div>
      <div class="q-text" style="font-size:15px;">${q.question}</div>`;
    if(q.type==='short'){
      body += `<div style="font-size:13.5px; color:var(--muted);">${t('yourAnswer')}: ${ans.text||'—'}</div>
        <div style="font-size:13.5px; color:var(--success);">${t('correctAnswer')}: ${q.correctAnswer}</div>`;
    } else {
      const letters=['A','B','C','D'];
      body += (q.options||[]).map((opt,idx)=>{
        let cls='q-opt';
        if(idx===q.correctIndex) cls+=' correct';
        else if(idx===ans.selected) cls+=' wrong';
        return `<div class="${cls}" style="margin-top:8px; cursor:default;"><span>${opt}</span><span class="letter">${letters[idx]||idx+1}</span></div>`;
      }).join('');
    }
    div.innerHTML = body;
    list.appendChild(div);
  });

  showScreen('resultsScreen');
}

$('#newQuizBtn').addEventListener('click', ()=>{
  state.images = []; state.questions = []; state.answers = []; state.current = 0;
  renderThumbs();
  showScreen('setupScreen');
});

/* ===================== Init ===================== */
function init(){
  applyTheme();
  applyUILanguage();
  renderCount();
  if(hasBuiltInKey()){
    $('#apiKeyNote').classList.add('hidden');
    $('#settingsBtn').classList.add('hidden');
  }
  $(`#styleGrid .opt-btn[data-style="mixed"]`).classList.add('active');
  $(`#quizLangChips .chip[data-qlang="${state.quizLang}"]`)?.classList.add('active');
  $(`#difficultyChips .chip[data-diff="medium"]`).classList.add('active');

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
}
init();
</script>
</body>
</html>
